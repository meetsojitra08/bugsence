<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BugSense | Issue tracking from report to resolution</title>
    <meta
      name="description"
      content="Bring bug reports, issue tracking and team collaboration into one clear workflow. Use editable AI suggestions to speed up triage and keep work moving."
    />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="BugSense | Issue tracking from report to resolution" />
    <meta
      property="og:description"
      content="Turn incoming reports into clear issues, coordinate work across your team and keep project progress visible."
    />
    <meta property="og:type" content="website" />
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("bugsense-ui-theme");
          var mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "dark";
          var dark =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
              : mode === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("light", !dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#000000" : "#F7F5F2");
        } catch (error) {
          /* localStorage may be unavailable; the dark default still applies. */
        }
      })();
    </script>
  </head>
  <body class="bg-background text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
